<!doctype html>
<html lang="de">
<head>

<title>Skipass Benni</title>
<style>
  :root { --red: #d6463a; --ink: #262626; --ice: #e8f1f8; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ice); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 18px; overflow: hidden; max-width: 340px; width: 100%; box-shadow: 0 8px 30px rgba(38, 38, 38, .15); }
  .top { background: var(--red); color: #fff; padding: 18px 20px; font-weight: 800; font-size: 28px; letter-spacing: .04em; }
  .body { padding: 20px; display: grid; gap: 14px; }
  a.btn { display: block; text-align: center; background: var(--ink); color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 700; }
  small { color: #5d6672; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">SKIPASS</div>
    <div class="body">
      <div><b>Benni</b> · 1 Skitag mit Hendrik</div>
      <a class="btn" href="Skipass-Benni.pkpass">Zu Apple Wallet hinzufügen</a>
      <small>Auf dem iPhone in Safari öffnen.</small>
    </div>
  </div>
</body>
